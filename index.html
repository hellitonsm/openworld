<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Sorteio</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#222}
h1{font-size:1.6rem}
.card{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}
label{display:block;margin:8px 0 4px}
input{padding:8px;font-size:1rem;width:100%;box-sizing:border-box}
button{padding:10px 16px;font-size:1rem;cursor:pointer;margin-top:8px}
.status{font-family:monospace;font-size:.9rem;word-break:break-all;background:#f5f5f5;padding:8px;border-radius:4px}
.result{font-size:2rem;font-weight:bold;text-align:center;padding:16px}
.muted{color:#666;font-size:.9rem}
</style>
</head>
<body>
<h1>Sistema de Sorteio (Hash)</h1>
<div class="card">
  <div>Status: <span id="status">pronto</span></div>
  <div class="muted">Ultimo hash: <span id="lastHash" class="status">-</span></div>
  <div class="muted">Novo hash: <span id="newHash" class="status">-</span></div>
  <label for="manualHash">Hash manual (opcional):</label>
  <input id="manualHash" placeholder="cole o hash aqui" />
  <button id="useManualBtn">Usar hash manual como "novo"</button>
  <button id="startBtn">Iniciar (capturar hash atual e aguardar novo)</button>
</div>
<div class="card">
  <label for="maxVal">Numero maximo (X):</label>
  <input id="maxVal" type="number" min="1" value="10" />
  <button id="drawBtn" disabled>Sortear</button>
</div>
<div class="card">
  <div class="result" id="result">-</div>
</div>
<script>
const statusEl=document.getElementById('status');
const lastHashEl=document.getElementById('lastHash');
const newHashEl=document.getElementById('newHash');
const startBtn=document.getElementById('startBtn');
const drawBtn=document.getElementById('drawBtn');
const resultEl=document.getElementById('result');
const maxValEl=document.getElementById('maxVal');

document.getElementById('useManualBtn').addEventListener('click', ()=>{
  const h=document.getElementById('manualHash').value.trim();
  if(!/^[0-9a-f]{64}$/i.test(h)){ alert('hash invalido'); return; }
  lastHash=lastHash||h;
  newHash=h;
  newHashEl.textContent=newHash;
  statusEl.textContent='hash manual definido; pronto para sortear';
  drawBtn.disabled=false;
});
let newHash=null;
let polling=null;

async function fetchTipHash(){
  const urls=[
    'https://mempool.space/api/blocks/tip/hash',
    'https://api.allorigins.win/raw?url='+encodeURIComponent('https://mempool.space/api/blocks/tip/hash')
  ];
  for(const u of urls){
    try{
      const r=await fetch(u);
      if(!r.ok) continue;
      const t=(await r.text()).trim();
      if(t && /^[0-9a-f]{64}$/i.test(t)) return t;
    }catch(e){}
  }
  throw new Error('falha ao buscar hash (CORS/rede). Cole o hash manualmente.');
}

startBtn.addEventListener('click', async ()=>{
  startBtn.disabled=true;
  drawBtn.disabled=true;
  statusEl.textContent='capturando hash atual...';
  try{
    lastHash=await fetchTipHash();
    lastHashEl.textContent=lastHash;
    newHash=null;
    newHashEl.textContent='-';
    statusEl.textContent='aguardando novo hash (novo bloco)...';
    polling=setInterval(async ()=>{
      try{
        const h=await fetchTipHash();
        if(h!==lastHash){
          newHash=h;
          newHashEl.textContent=newHash;
          clearInterval(polling);polling=null;
          statusEl.textContent='novo hash gerado! pronto para sortear';
          drawBtn.disabled=false;
          startBtn.disabled=false;
        }
      }catch(e){ statusEl.textContent='erro: '+e.message; }
    },15000);
  }catch(e){
    statusEl.textContent='erro: '+e.message;
    startBtn.disabled=false;
  }
});

drawBtn.addEventListener('click', ()=>{
  const X=parseInt(maxValEl.value,10);
  if(!X||X<1){ alert('X invalido'); return; }
  if(!newHash){ alert('aguarde novo hash'); return; }
  // derive number from hash: use first 8 hex chars -> int, mod X +1
  const n=parseInt(newHash.slice(0,8),16);
  const winner=(n % X)+1;
  resultEl.textContent=winner;
  statusEl.textContent='sorteado com base no novo hash';
});
</script>
</body>
</html>
